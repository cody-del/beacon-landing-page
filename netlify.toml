[build]
  base = "."
  publish = "motorized-shades/dist"
  command = "node motorized-shades/build-interior.mjs && node --test motorized-shades/consultation.test.mjs motorized-shades/consultation-http.test.mjs motorized-shades/turnstile.test.mjs motorized-shades/tracking.test.mjs motorized-shades/interior-hero.test.mjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
